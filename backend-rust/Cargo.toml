[package]
name = "omnimed-backend-rust"
version = "0.1.0"
edition = "2021"
description = "OmniMed Insight (XAI) Primary Security & Clinical Workflow Backend"

[dependencies]
axum = { version = "0.7.7", features = ["multipart", "macros"] }
tokio = { version = "1.40.0", features = ["full"] }
tower = { version = "0.5.1", features = ["util"] }
tower-http = { version = "0.6.1", features = ["cors", "trace", "limit"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
argon2 = "0.5.3"
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.2"
tempfile = "3.13.0"
